{{- $destination := .Destination -}}
{{- $external := or (hasPrefix $destination "http://") (hasPrefix $destination "https://") -}}
<a href="{{ $destination | safeURL }}"{{ if $external }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}{{ if $external }}<span class="external-mark" aria-hidden="true"> ↗</span>{{ end }}</a>
