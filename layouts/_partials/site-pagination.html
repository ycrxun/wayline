{{- $paginator := . -}}
{{ if gt $paginator.TotalPages 1 }}
<nav class="pagination" aria-label="分页">
    <div class="pagination__status">
        PAGE <strong>{{ printf "%02d" $paginator.PageNumber }}</strong> / {{ printf "%02d" $paginator.TotalPages }}
    </div>
    <div class="pagination__links">
        {{ with $paginator.Prev }}<a href="{{ .URL }}" aria-label="上一页">← PREV</a>{{ else }}<span aria-disabled="true">← PREV</span>{{ end }}
        {{ with $paginator.Next }}<a href="{{ .URL }}" aria-label="下一页">NEXT →</a>{{ else }}<span aria-disabled="true">NEXT →</span>{{ end }}
    </div>
</nav>
{{ end }}
