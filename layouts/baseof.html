<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}" data-theme="dark">
    <head>
        {{ partial "head.html" . }}
    </head>
    <body class="{{ block "body-class" . }}site-body{{ end }}">
        <a class="skip-link" href="#main-content">跳到正文</a>
        {{ partial "header.html" . }}
        <button class="nav-backdrop" type="button" tabindex="-1" aria-label="关闭导航"></button>
        <main id="main-content">
            {{ block "main" . }}{{ end }}
        </main>
        {{ partial "footer.html" . }}
        {{ partial "search-overlay.html" . }}

        {{ $js := resources.Get "js/main.js" | js.Build (dict "minify" (not hugo.IsDevelopment)) | fingerprint }}
        <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
    </body>
</html>
